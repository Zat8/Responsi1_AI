<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuzzy - Mental Health Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body data-page="fuzzy">
    <div class="site-shell">
        <header class="topbar">
            <div class="container topbar-inner">
                <a class="brand" href="./index.html">Mental Health Lab</a>
                <nav class="topnav">
                    <a href="./index.html">Home</a>
                    <a href="./fuzzy.html">Logika Fuzzy</a>
                    <a href="./expert.html">Sistem Pakar</a>
                    <a href="./dataset.html">Validasi Dataset</a>
                </nav>
            </div>
        </header>

        <main class="container page">
            <section class="panel-grid">
                <div class="glass-card panel-main">
                    <span class="section-label">Input Fuzzy</span>
                    <h2>Estimasi tingkat stres</h2>
                    <p class="muted">
                        Atur sesuai kondisimu
                    </p>

                    <form id="fuzzy-form" class="stack-lg">
                        <label class="range-field">
                            <span class="field-head">
                                <span>Jam tidur</span>
                                <output id="jam_tidur_output" class="range-value">6 jam</output>
                            </span>
                            <input id="jam_tidur" name="jam_tidur" type="range" min="0" max="12" value="6">
                            <span class="mini-note">0-12 jam per hari</span>
                        </label>

                        <label class="range-field">
                            <span class="field-head">
                                <span>Jumlah tugas</span>
                                <output id="jumlah_tugas_output" class="range-value">5 tugas</output>
                            </span>
                            <input id="jumlah_tugas" name="jumlah_tugas" type="range" min="0" max="10" value="5">
                            <span class="mini-note">0-10 beban tugas</span>
                        </label>

                        <label class="range-field">
                            <span class="field-head">
                                <span>Mood</span>
                                <output id="mood_output" class="range-value">5/10</output>
                            </span>
                            <input id="mood" name="mood" type="range" min="0" max="10" value="5">
                            <span class="mini-note">0 = sangat buruk, 10 = sangat baik</span>
                        </label>

                        <button type="submit" class="button button-primary">Hitung Tingkat Stres</button>
                    </form>
                </div>

                <aside class="glass-card panel-side">
                    <span class="section-label">Hasil Fuzzy</span>
                    <div id="fuzzy-empty" class="empty-state">
                        Geser input lalu tekan tombol hitung untuk melihat skor, kategori, dan saran.
                    </div>
                    <div id="fuzzy-result" class="hidden"></div>
                </aside>
            </section>
        </main>
    </div>

    <script src="./app.js"></script>
</body>
</html>
