<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mental Health App{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f4efe6;
            --surface: rgba(255, 252, 247, 0.92);
            --surface-strong: #fffaf3;
            --text: #1f2937;
            --muted: #6b7280;
            --line: rgba(148, 163, 184, 0.25);
            --primary: #c06137;
            --primary-dark: #8f4120;
            --accent: #2f6f62;
            --accent-soft: #dff1ea;
            --warning-soft: #fff1cf;
            --danger-soft: #ffe1da;
            --shadow: 0 24px 60px rgba(103, 74, 49, 0.12);
        }

        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            color: var(--text);
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(192, 97, 55, 0.18), transparent 32%),
                radial-gradient(circle at top right, rgba(47, 111, 98, 0.16), transparent 28%),
                linear-gradient(160deg, #f8f3eb 0%, #efe6d7 100%);
        }

        .site-shell {
            position: relative;
        }

        .site-shell::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.24) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.24) 1px, transparent 1px);
            background-size: 32px 32px;
            opacity: 0.25;
            pointer-events: none;
        }

        .glass-card {
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 28px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
        }

        .hero-card {
            overflow: hidden;
            position: relative;
        }

        .hero-card::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            right: -40px;
            top: -40px;
            border-radius: 50%;
            background: rgba(192, 97, 55, 0.11);
        }

        .navbar {
            background: rgba(28, 36, 44, 0.88) !important;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .navbar-brand {
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.78) !important;
            font-weight: 600;
        }

        .nav-link:hover,
        .nav-link.active {
            color: #fff !important;
        }

        .btn-primary,
        .btn-success {
            border: none;
            border-radius: 999px;
            padding: 0.8rem 1.1rem;
            font-weight: 700;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #cb6c40 0%, #7f391d 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--accent) 0%, #244f46 100%);
        }

        .metric-pill,
        .tag-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.45rem 0.85rem;
            border-radius: 999px;
            font-size: 0.92rem;
            font-weight: 600;
        }

        .metric-pill {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid var(--line);
        }

        .tag-pill {
            background: var(--accent-soft);
            color: #17453c;
        }

        .section-label {
            font-size: 0.82rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--primary);
        }

        .range-value {
            min-width: 58px;
            text-align: center;
            padding: 0.35rem 0.75rem;
            background: var(--surface-strong);
            border: 1px solid var(--line);
            border-radius: 999px;
            font-weight: 700;
        }

        .form-range::-webkit-slider-thumb {
            background: var(--primary);
        }

        .form-range::-moz-range-thumb {
            background: var(--primary);
        }

        .result-panel {
            border-radius: 24px;
            padding: 1.4rem;
            border: 1px solid transparent;
        }

        .result-panel.low {
            background: #ecfaf4;
            border-color: #bee8d0;
        }

        .result-panel.medium {
            background: var(--warning-soft);
            border-color: #f2d691;
        }

        .result-panel.high {
            background: var(--danger-soft);
            border-color: #efb6a8;
        }

        .progress {
            height: 14px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.22);
        }

        .progress-bar {
            border-radius: 999px;
            font-weight: 700;
        }

        .soft-table {
            overflow: hidden;
            border-radius: 20px;
            border: 1px solid var(--line);
        }

        .soft-table table {
            margin-bottom: 0;
        }

        .soft-table thead th {
            background: rgba(255, 250, 243, 0.92);
            border-bottom: 1px solid var(--line);
        }

        .soft-table td,
        .soft-table th {
            padding: 0.95rem 1rem;
        }

        .mini-note {
            color: var(--muted);
            font-size: 0.93rem;
        }
    </style>
</head>
<body>
    <div class="site-shell">
        <nav class="navbar navbar-dark navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="{{ url_for('index') }}">Mental Health Lab</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-end" id="mainNavbar">
                    <div class="navbar-nav gap-lg-2">
                        <a class="nav-link {% if request.endpoint == 'fuzzy_page' %}active{% endif %}" href="{{ url_for('fuzzy_page') }}">Fuzzy Stress</a>
                        <a class="nav-link {% if request.endpoint == 'expert_page' %}active{% endif %}" href="{{ url_for('expert_page') }}">Sistem Pakar</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container py-4 py-lg-5">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
